<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    Deterministic, repository-owned font discovery for the headless DOCX gate.
    The resolved family map is recorded in the verification report, so a host
    whose installed font files differ cannot silently masquerade as the same
    render environment.
  -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>

  <alias binding="same">
    <family>Songti SC</family>
    <prefer><family>Noto Serif CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Hiragino Sans GB</family>
    <prefer><family>Noto Sans CJK SC</family></prefer>
  </alias>
  <alias binding="same">
    <family>Times New Roman</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>Arial</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>Courier</family>
    <prefer><family>Nimbus Mono PS</family></prefer>
  </alias>
</fontconfig>
