name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install product and test extras
        run: python -m pip install --upgrade pip && python -m pip install '.[web,legacy,dev]'
      - name: Guard repository contents
        run: translation-agent-repo-guard
      - name: Compile source
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Build wheel and source distribution
        run: python -m build

