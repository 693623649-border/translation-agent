schema_version = 1

[profiles.glm_vision]
adapter = "coding-plan-mcp"
provider = "zhipu"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
model = "glm-4.6v"
credential_env = "GLM_CODING_API_KEY"
command = ["cmd", "/c", "npx", "-y", "@z_ai/mcp-server@0.1.4"]
timeout = 180
concurrency = 4
thinking = "omit"
# Generic preset: choose "vertical" explicitly for Japanese/Chinese tategaki.
reading_direction = "horizontal"

[profiles.glm_toc]
adapter = "openai-chat"
provider = "zhipu"
base_url = "https://open.bigmodel.cn/api/coding/paas/v4"
model = "glm-5.2"
credential_env = "GLM_TOC_API_KEY"
timeout = 120
concurrency = 1
thinking = "disabled"

[profiles.deepseek_pro]
adapter = "openai-chat"
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
credential_env = "DEEPSEEK_API_KEY"
timeout = 120
concurrency = 16
thinking = "enabled"

[profiles.deepseek_flash]
adapter = "openai-chat"
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
credential_env = "DEEPSEEK_API_KEY"
timeout = 600
concurrency = 32
thinking = "enabled"
reasoning_effort = "max"

# 本地 vLLM 翻译后端（deploy/local-llm/docker-compose.yml）。
# 切回云端只需把 [pipeline].translation_profile 改回 "deepseek_flash"。
[profiles.local_llm]
adapter = "openai-chat"
provider = "local"
base_url = "http://127.0.0.1:8010/v1"
model = "Intel/Hy-MT2-30B-A3B-int4-AutoRound"
# vLLM 未以 --api-key 启动时无需真实凭据；缺失时自动使用占位符。
credential_env = "LOCAL_LLM_API_KEY"
timeout = 600
concurrency = 16
thinking = "omit"

[pipeline]
ocr_profile = "glm_vision"
toc_profile = "glm_toc"
# 本分支默认走本地 vLLM（替代分支语义）；原分支保持 deepseek_flash。
translation_profile = "local_llm"
# OCR 校勘不是翻译：按"只替换翻译阶段"的边界保留在 DeepSeek 上。
# 若要连校勘也走本地，改回 "local_llm" 即可。
proofread_profile = "deepseek_flash"

[profiles.paddleocr_local]
adapter = "paddleocr-local"
provider = "paddleocr"
base_url = ""
model = "PP-OCRv6-medium"
credential_env = ""
timeout = 600
concurrency = 1
thinking = "disabled"
