schema_version = 1

[profiles.deepseek_pro]
adapter = "openai-chat"
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-v4-pro"
credential_env = "DEEPSEEK_API_KEY"
timeout = 120
concurrency = 16
thinking = "disabled"

[profiles.deepseek_flash]
adapter = "openai-chat"
provider = "deepseek"
base_url = "https://api.deepseek.com"
model = "deepseek-flash"
credential_env = "DEEPSEEK_API_KEY"
timeout = 600
concurrency = 32
thinking = "enabled"
reasoning_effort = "max"

# 可选：本地 vLLM 翻译后端（deploy/local-llm/docker-compose.yml）。
# 启用方式：把 [pipeline].translation_profile / proofread_profile 改为 "local_llm"。
[profiles.local_llm]
adapter = "openai-chat"
provider = "local"
base_url = "http://127.0.0.1:8010/v1"
model = "Intel/Hy-MT2-30B-A3B-int4-AutoRound"
credential_env = "LOCAL_LLM_API_KEY"
timeout = 600
concurrency = 48
thinking = "omit"

[pipeline]
ocr_profile = "paddleocr_local"
translation_profile = "deepseek_flash"
# Optional. When omitted, proofreading safely reuses translation_profile.
proofread_profile = "deepseek_flash"

[profiles.paddleocr_local]
adapter = "paddleocr-local"
provider = "paddleocr"
base_url = ""
model = "PP-OCRv6-medium"
credential_env = ""
timeout = 600
concurrency = 1
thinking = "disabled"
