[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translation-agent"
version = "0.1.0"
description = "Local-first semantic translation and publication pipeline for books"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Markdown>=3.6,<4",
  "Pillow>=10,<13",
  "PyMuPDF>=1.24,<2",
  "lxml>=5,<7",
  "opencc-python-reimplemented>=0.1.7,<1",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
legacy = ["openai>=1,<3", "reportlab>=4,<5"]
dev = [
  "build>=1.2,<2",
  "numpy>=1.26,<3",
]

[project.scripts]
translation-agent = "orchestration.document_pipeline:cli"
translation-agent-doctor = "orchestration.doctor:main"
translation-agent-repo-guard = "orchestration.repository_guard:main"
translation-agent-kb = "knowledge.knowledge_base_cli:main"
translation-agent-global-kb = "knowledge.global_knowledge_base:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
# Namespace discovery descends into every directory, so it walked `.venv/`,
# `deploy/`, `outputs/` and the trash folders — tens of thousands of files with
# no package marker — and the editable build never returned.  Every shipped
# package has an `__init__.py`, so plain package discovery plus the explicit
# exclude list keeps the scan bounded.
namespaces = false
include = [
  "pipeline_graph*",
  "orchestration*",
  "ingestion*",
  "translation*",
  "publication*",
  "knowledge*",
  "frontend*",
]
exclude = [
  ".venv*",
  ".tmp*",
  ".git*",
  ".github*",
  ".codex-trash*",
  ".cursor*",
  ".dsh*",
  ".learnings*",
  ".omx*",
  ".pytest_cache*",
  "archive*",
  "book*",
  "deploy*",
  "docs*",
  "node_modules*",
  "outputs*",
  "recipes*",
  "schemas*",
  "skills*",
  "tests*",
  "tmp*",
  "tools*",
  "work*",
]

[tool.setuptools.data-files]
"share/translation-agent" = ["pipeline.example.toml"]
"share/translation-agent/schemas" = ["schemas/*.json"]
"share/translation-agent/recipes" = ["recipes/*.toml"]
