[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "translation-agent"
version = "0.1.0"
description = "Local-first semantic translation and publication pipeline for books"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Markdown>=3.6,<4",
  "Pillow>=10,<13",
  "PyMuPDF>=1.24,<2",
  "lxml>=5,<7",
  "opencc-python-reimplemented>=0.1.7,<1",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
web = ["streamlit>=1.48,<2"]
paddle = ["paddlepaddle>=3.3,<3.4", "paddleocr>=3.7,<3.8"]
legacy = ["openai>=1,<3", "reportlab>=4,<5"]
dev = [
  "build>=1.2,<2",
  "streamlit>=1.48,<2",
]

[project.scripts]
translation-agent = "translation_agent.cli.document_pipeline:cli"
translation-agent-doctor = "translation_agent.cli.doctor:main"
translation-agent-web = "translation_agent.cli.launch_frontend:main"
translation-agent-paddle = "translation_agent.ocr.paddle_native:main"
translation-agent-repo-guard = "translation_agent.runtime.repository_guard:main"
translation-agent-global-kb = "translation_agent.knowledge.global_knowledge_base:main"
translation-agent-kb = "translation_agent.cli.knowledge_base_cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["translation_agent*"]

[tool.setuptools.data-files]
"share/translation-agent" = ["pipeline.example.toml"]
"share/translation-agent/schemas" = ["schemas/*.json"]
"share/translation-agent/recipes" = ["recipes/*.toml"]
